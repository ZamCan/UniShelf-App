name: Native Office engine feasibility
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/office-native.yml'
permissions:
  contents: read
env:
  # A cold LibreOffice build recompiles the same translation units many times
  # across configure probes, the main build and the Android packaging phase.
  # ccache is the only lever that makes a second attempt survivable.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_BASEDIR: ${{ github.workspace }}
  ENGINE_ABI: arm64-v8a
jobs:
  native:
    runs-on: ubuntu-24.04
    # GitHub-hosted jobs are hard-capped at 360 minutes; 350 left no room for
    # packaging, so spend the maximum and bound the compile step itself.
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reclaim disk space
        run: |
          set -Eeuo pipefail
          # The hosted runner ships ~14 GB free; a cold LibreOffice tree plus the
          # NDK output does not fit alongside the preinstalled toolchains.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /opt/az /usr/lib/jvm/*/lib/src.zip || true
          sudo apt-get clean
          df -h /
      - name: Inspect runner and install prerequisites
        run: |-
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Exit $rc at line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR
          df -h
          free -h
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gperf nasm pkg-config libtool python3-dev zip unzip ccache make gcc g++ perl gettext gawk libxml2-dev libxslt1-dev libxml2-utils xsltproc libcairo2-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxext-dev libxrender-dev libxrandr-dev libxinerama-dev libxt-dev libcups2-dev libdbus-1-dev libglib2.0-dev
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          java -version
          command -v make git python3 autoconf
          test -x "$(command -v ccache)"
          ccache --version | head -1
          "$SDKMANAGER" --install "ndk;27.2.12479018" "build-tools;30.0.3" "platforms;android-35"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: lo-ccache-25.8.0.1-${{ env.ENGINE_ABI }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lo-ccache-25.8.0.1-${{ env.ENGINE_ABI }}-
      - name: Prepare ccache
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Fetch upstream Android engine
        run: |-
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Exit $rc at line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR
          git clone --depth 1 --branch libreoffice-25.8.0.1 https://github.com/LibreOffice/core.git core
          cd core
          git rev-parse HEAD
      - name: Configure and compile ARM64 editing runtime
        # Leaves ~30 minutes of the job budget for packaging and diagnostics, so
        # a stalled compile still uploads logs instead of losing everything to
        # the job-level timeout.
        timeout-minutes: 330
        run: |-
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Exit $rc at line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR
          cd core
          JOBS="$(nproc)"
          MEM_JOBS="$(awk '/MemAvailable:/ {n=int($2/3145728); print (n<1?1:n)}' /proc/meminfo)"
          if (( JOBS > MEM_JOBS )); then JOBS="$MEM_JOBS"; fi
          echo "Building with $JOBS parallel jobs"
          if ./autogen.sh --with-distro=LibreOfficeAndroidAarch64 \
              --with-android-sdk="$ANDROID_HOME" \
              --with-android-ndk="$ANDROID_HOME/ndk/27.2.12479018" \
              --with-jdk-home="$JAVA_HOME" \
              --enable-android-editing \
              --enable-ccache \
              --disable-werror \
              --with-parallelism="$JOBS" \
              2>&1 | tee "$GITHUB_WORKSPACE/configure-output.log"; then
            echo 'Configuration passed'
          else
            detail="$(grep -E 'configure: error:|Error running|not found|command not found' "$GITHUB_WORKSPACE/configure-output.log" | tail -8 | tr '\n' ' ' || true)"
            echo "::error title=LibreOffice configuration failure::$detail"
            exit 1
          fi
          make 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"
          ccache --show-stats || true
      - name: Verify native library and APK outputs
        run: |-
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Exit $rc at line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR
          find core -name liblo-native-code.so -print | tee native-files.txt
          test -s native-files.txt
          find core/android -name '*.apk' -print | tee apk-files.txt
          test -s apk-files.txt
      - name: Package versioned engine artifact
        run: |-
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Exit $rc at line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR
          cd "$GITHUB_WORKSPACE"

          LO_COMMIT="$(git -C core rev-parse HEAD)"
          LO_SHORT="$(git -C core rev-parse --short=12 HEAD)"
          SOURCE_DATE_EPOCH="$(git -C core log -1 --format=%ct)"
          LO_TAG="$(git -C core describe --tags --always 2>/dev/null || echo unknown)"
          LO_VERSION="$(sed -n 's/^AC_INIT(\[LibreOffice\],\[\([^],]*\)\].*/\1/p' core/configure.ac | head -1)"
          LO_VERSION="${LO_VERSION:-$LO_TAG}"
          LO_VERSION="$(printf '%s' "$LO_VERSION" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          test -n "$LO_VERSION"

          ENGINE_NAME="unishelf-office-engine-${LO_VERSION}-${ENGINE_ABI}"
          STAGE="dist/${ENGINE_NAME}"
          rm -rf dist
          mkdir -p "$STAGE/lib" "$STAGE/licenses"

          # Package a coherent upstream APK, not an arbitrary host library.
          python3 - <<'PY'
          import pathlib, zipfile, struct, shutil
          candidates = []
          for p in pathlib.Path("core/android").rglob("*.apk"):
              with zipfile.ZipFile(p) as z:
                  names = z.namelist()
                  libs = [n for n in names if n.startswith("lib/arm64-v8a/") and n.endswith(".so")]
                  if not any(n.endswith("/liblo-native-code.so") for n in libs):
                      continue
                  if not any(n.startswith("assets/") and not n.endswith("/") for n in names):
                      continue
                  if "classes.dex" not in names or z.testzip() is not None:
                      continue
                  candidates.append(p)
          if not candidates:
              raise SystemExit("No coherent ARM64 LibreOffice APK found")
          stage = next(pathlib.Path("dist").glob("unishelf-office-engine-*"))
          for i, p in enumerate(sorted(candidates)):
              target = stage / ("upstream-" + str(i) + ".apk")
              shutil.copy2(p, target)
          with zipfile.ZipFile(sorted(candidates)[0]) as z:
              for n in z.namelist():
                  if n.startswith("lib/arm64-v8a/") and n.endswith(".so"):
                      data = z.read(n)
                      if data[:6] != b"\x7fELF\x02\x01" or struct.unpack_from("<H", data, 18)[0] != 183:
                          raise SystemExit("Invalid ARM64 ELF: " + n)
                      (stage / "lib" / pathlib.Path(n).name).write_bytes(data)
          PY
          STRIPPED="false"

          # Upstream licensing: MPL-2.0 / LGPLv3 umbrella files plus NOTICE.
          license_sources=()
          for candidate in core/COPYING* core/NOTICE* core/LICENSE* core/README_licenses*; do
            if [[ -f "$candidate" ]]; then
              license_sources+=("$candidate")
            fi
          done
          if (( ${#license_sources[@]} == 0 )); then
            echo "::error title=Missing license files::No COPYING/NOTICE file found in the upstream tree"
            exit 1
          fi
          cp -v "${license_sources[@]}" "$STAGE/licenses/"

          printf '%s\n' \
            "UniShelf offline office engine (${ENGINE_ABI})" \
            "===============================================" \
            "" \
            "Contents: upstream Android APK(s) with matching bindings, assets and ARM64 libraries; extracted native libraries for inspection." \
            "" \
            "Upstream project: The Document Foundation / LibreOffice" \
            "Upstream tag:     libreoffice-25.8.0.1" \
            "Upstream commit:  ${LO_COMMIT}" \
            "Upstream source:  https://github.com/LibreOffice/core/tree/${LO_COMMIT}" \
            "Built:            $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "" \
            "LibreOffice is free software. The engine is distributed under the Mozilla" \
            "Public License v2.0 and, for parts explicitly marked as such, the GNU Lesser" \
            "General Public License v3 or later. The full licence texts are shipped" \
            "unmodified in the licenses/ directory of this archive. See" \
            "https://www.libreoffice.org/about-us/licenses/ for the authoritative list," \
            "including third-party components bundled inside the engine." \
            "" \
            "This archive contains upstream build output, not a verified UniShelf integration;" \
            "the corresponding sources are available at the upstream URL above and are" \
            "unchanged." \
            > "$STAGE/NOTICE.txt"

          SO_SHA="$(sha256sum "$STAGE/lib/liblo-native-code.so" | cut -d' ' -f1)"
          SO_SIZE="$(stat -c %s "$STAGE/lib/liblo-native-code.so")"
          printf '%s\n' \
            '{' \
            '  "name": "unishelf-office-engine",' \
            "  \"version\": \"${LO_VERSION}\"," \
            "  \"abi\": \"${ENGINE_ABI}\"," \
            '  "upstream": {' \
            '    "project": "LibreOffice",' \
            '    "tag": "libreoffice-25.8.0.1",' \
            "    \"commit\": \"${LO_COMMIT}\"," \
            '    "distro": "LibreOfficeAndroidAarch64"' \
            '  },' \
            '  "build": {' \
            '    "runner": "ubuntu-24.04",' \
            '    "ndk": "27.2.12479018",' \
            '    "jdk": "17",' \
            '    "ccache": true,' \
            "    \"stripped\": ${STRIPPED}," \
            "    \"source_date_epoch\": ${SOURCE_DATE_EPOCH}," \
            "    \"workflow_run\": \"${GITHUB_RUN_ID}\"," \
            "    \"workflow_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"" \
            '  },' \
            '  "payload": [' \
            '    {' \
            '      "path": "lib/liblo-native-code.so",' \
            "      \"bytes\": ${SO_SIZE}," \
            "      \"sha256\": \"${SO_SHA}\"" \
            '    }' \
            '  ],' \
            '  "license": "MPL-2.0 OR LGPL-3.0-or-later (see licenses/)"' \
            '}' \
            > "$STAGE/manifest.json"
          python3 - "$STAGE" <<'PY'
          import hashlib, json, pathlib, sys
          stage = pathlib.Path(sys.argv[1])
          p = stage / "manifest.json"
          m = json.loads(p.read_text())
          m["verification"] = "package inspection only; Android execution and editing unverified"
          m["payload"] = [{"path": str(f.relative_to(stage)), "bytes": f.stat().st_size,
                           "sha256": hashlib.file_digest(f.open("rb"), "sha256").hexdigest()}
                          for f in sorted(stage.rglob("*")) if f.is_file() and f != p]
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY

          # Checksums cover every payload file, then the archive itself.
          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort \
              | xargs -r sha256sum > SHA256SUMS
          )
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            -C dist -czf "dist/${ENGINE_NAME}.tar.gz" "$ENGINE_NAME"
          (
            cd dist
            sha256sum "${ENGINE_NAME}.tar.gz" > "${ENGINE_NAME}.tar.gz.sha256"
          )

          # APKs travel with the same checksum manifest format.
          : > dist/apk-sha256sums.txt
          while IFS= read -r apk; do
            cp -v "$apk" "dist/$(basename "$apk")"
          done < apk-files.txt
          (
            cd dist
            find . -maxdepth 1 -name '*.apk' -printf '%f\n' | LC_ALL=C sort \
              | xargs -r sha256sum > apk-sha256sums.txt
          )

          echo "ENGINE_VERSION=$LO_VERSION" >> "$GITHUB_ENV"
          echo "ENGINE_ARTIFACT=${ENGINE_NAME}" >> "$GITHUB_ENV"
          echo "--- dist ---"
          ls -l dist
          echo "--- engine SHA256SUMS ---"
          cat "$STAGE/SHA256SUMS"
          echo "--- archive checksum ---"
          cat "dist/${ENGINE_NAME}.tar.gz.sha256"
          echo "--- apk checksums ---"
          cat dist/apk-sha256sums.txt
      - name: Ensure ccache directory exists
        if: always()
        run: mkdir -p "$CCACHE_DIR"
      - name: Save ccache
        # A failed attempt is exactly when the compiled objects are worth
        # keeping: the next run reuses them instead of paying for a full cold
        # build again. Saving under a key that already exists (a retry of the
        # same commit) is not an error, so it must not fail the job.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: lo-ccache-25.8.0.1-${{ env.ENGINE_ABI }}-${{ github.sha }}
      - name: Upload versioned engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/apk-sha256sums.txt
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-office-prototype
          path: core/android/**/*.apk
          if-no-files-found: error
      - name: Preserve configuration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-configuration-diagnostics
          path: |
            configure-output.log
            build-output.log
            core/config.log
            core/config_host/config.log
          if-no-files-found: warn
